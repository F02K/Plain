[project]
name = "plain-lang"
dynamic = ["version"]
description = "Plain: a beginner friendly programming language: Python, but simpler."
license = { file = "LICENSE" }
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
plain = "plain.cli:main"

[project.gui-scripts]
plain-ide = "plainide.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["plain", "modules", "modules.window", "plainide"]

[tool.setuptools.package-dir]
"" = "."
plainide = "ide/plainide"

[tool.setuptools.dynamic]
version = { attr = "plain.__version__" }

[tool.setuptools.package-data]
"modules.window" = ["window.plain", "window_impl.py"]
